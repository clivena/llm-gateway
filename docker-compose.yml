services:
  redis:
    image: redis/redis-stack-server:7.4.0-v0
    ports: ["6379:6379"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llmgw
    # 宿主端口用 55432 而不是 5432：
    # 本机装了 PostgreSQL 10 的 Windows 服务 (postgresql-x64-10) 并常驻 5432，
    # 两个 postgres 抢同一端口会导致应用连到「原生那个」（没有 llmgw 库），
    # 表现为 R2DBC 报 "Failed to obtain R2DBC Connection" + Connection reset。
    # 容器内仍是标准的 5432，只有宿主映射做了避让。
    ports: ["55432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
