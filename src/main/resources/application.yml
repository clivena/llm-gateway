server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  # 成本账本落库（Postgres / R2DBC）。连接是惰性的：Postgres 没起时应用照样能启动，
  # 只在真正写账本时失败并记日志，不影响主链路。
  # ★ 宿主端口是 15432 不是 5432，也不是 55432：
  #   - 5432 被本机 PostgreSQL 10 的 Windows 服务占着，连过去会打到那个原生实例
  #     （没有 llmgw 库）而报 Connection reset；
  #   - 55432 落在 Windows 动态端口排除区间 55359-55458 内，docker 绑不上
  #     （bind: ... forbidden by its access permissions），实测起不来。
  #   改这里必须同步改 docker-compose.yml 的 ports 映射。
  r2dbc:
    url: ${POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:15432/llmgw}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 2
      max-size: 8
      max-idle-time: 30s
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 关键：KafkaTemplate.send() 在 broker 不可达时会阻塞到 max.block.ms（默认 60000ms）
        # 才抛 TimeoutException。所谓"异步发送"因此会把响应一起拖住——实测每个请求多花 60s。
        # 压到 500ms 让它在不可用时快速失败，配合 ChatPipeline 里独立线程落账，彻底离开响应路径。
        max.block.ms: 500

gateway:
  # 账本落库方式：postgres（直写，开箱可用、可立刻对账）| kafka（流式，生产链路）| both
  # 默认 postgres：配合 docker compose 起来的 Postgres 即可闭环。
  # 生产上通常改成 kafka/both，让账本先进消息队列再由消费者入仓。
  cost:
    sink: ${COST_SINK:postgres}
  cache:
    enabled: true
    # L1 精确缓存：规范化问题 → SHA-256 → 直接查 Redis 单值。
    # 不依赖 embedding 能力，任何部署下都能真正命中（旧实现只有语义层，
    # 供应商没有 /embeddings 时缓存开着却一次都不命中，属于静默失效）。
    exact-enabled: true
    # L2 语义缓存：向量检索，能命中"意思相同但字面不同"的问题。
    # ★ 依赖上游的 /embeddings 能力。没有该端点的供应商（如 DeepSeek）请置 false ——
    #   开着的话每个请求都要多走一遍"试遍所有 adapter 取向量"的失败路径。
    semantic-enabled: true
    similarity-threshold: 0.92
    ttl-seconds: 3600
    max-entries-per-namespace: 500
  quota:
    default-limit-tokens: 200000
    period-ttl-seconds: 3024000
  # 重试与熔断（F1）。生效方式见 core/resilience/UpstreamResilience。
  # ★ 这几个参数是全局的，还没有 per-provider 覆盖 —— 理由见 GatewayProperties.Resilience。
  resilience:
    # 非流式请求的整体超时。与 WebClientConfig 的 netty responseTimeout(60s) 不重复：
    # 那个只管到"响应头到达"，这里管"整条 Mono 完成"。
    timeout-millis: 60000
    # 流式的**首片**超时，不是整条流的超时 —— 长回答天然要几十秒，
    # 给整条流设超时会把它拦腰砍断。映射到 Flux.timeout()，其作用域本就是首元素。
    first-chunk-timeout-millis: 30000
    retry:
      enabled: true
      # 总尝试次数含首次：3 = 首次 + 最多重试 2 次。
      # ★ 每次重试都是一次**真实计费**的上游调用，调大前先想清楚故障期的账单。
      max-attempts: 3
      wait-duration-millis: 300
      backoff-multiplier: 2.0
      max-wait-duration-millis: 2000
    circuit-breaker:
      enabled: true
      sliding-window-size: 20
      # ★ 这一项没有它，启动后头 2 个请求失败（失败率 100%）就会直接熔断 ——
      #   而 2 个样本什么都说明不了。熔断器最常见的误配置就是漏了它。
      minimum-number-of-calls: 8
      failure-rate-threshold: 50
      wait-duration-in-open-state-millis: 10000
      permitted-number-of-calls-in-half-open-state: 3
    # 跨 provider 故障转移（F2）。前置条件是同一个 model 名被多家 provider 声明 ——
    # 那些 provider 按上面 providers[] 的声明顺序组成候选链，链首优先。
    # ★ 只有一家 provider 时这个配置块完全无效（没有第二个候选可转移），
    #   所以它是"部署了几家"才生效的能力，不是一条永远在跑的兜底逻辑。
    failover:
      enabled: true
      # 最多试几家（含链首）。默认 2 = 主力 + 1 个备选。
      max-providers: 2
      # ★ 一次请求内允许发起的**上游调用总次数**（跨 provider 累计，含首次）。
      #   它和 retry.max-attempts 是相乘关系：3 次 × 3 家 = 9 次真实计费调用。
      #   这个上限就是用来把那个乘法关在盒子里的 —— 别只调大它，要一起想。
      max-total-attempts: 4
  # Token 估算系数 —— 配额预扣与兜底计费共用这一套口径。
  # ★ 这些是**实测校准值**，不是经验常数：token 数由上游的分词器决定，随供应商与
  #   模型版本变化。当前值来自 2026-10-16 对 deepseek-flash 的真机实测
  #   （见 scripts/calibrate-token-estimator.py）。**换供应商必须重新校准。**
  token-estimate:
    # 一次性固定开销：整个请求只付一次，与消息条数无关（上游套模板的固定成本）。
    # 实测 ≈26.5 —— 对 5 字提问占 80%，是短请求的绝对主导项；对 2000 字长请求只占 2.5%。
    # 这一项是实测挖出来的：只按"内容有多少字符"算，解释不了上游回传的 token 数
    # （"Explain caching" 15 个 ASCII 字符 → 上游回传 32 tokens）。
    base-overhead: 26.52
    # 每个 CJK / 全角字符折算的 token 数（实测 ≈0.512，约 2 汉字/token）
    cjk-per-char: 0.512
    # 每个非 CJK 字符折算的 token 数（实测 ≈0.188，约 5.3 字符/token）
    ascii-per-char: 0.188
    # 每条消息在一次性开销之上再付一次的结构开销（实测 ≈1.16）
    per-message-overhead: 1.16
    # 全局安全系数。刻意 > 1：配额场景下低估 = 允许超支（钱漏了且不可逆），
    # 高估 = 提前拦截。两害不对称，所以选保守方向。
    safety-factor: 1.05
  router:
    policy: COST_FIRST
    # ★ model=auto 用的候选表。模型名必须与下面 providers[].models 完全一致，
    #   否则应用**启动时**就会报错（见 RouterService 的启动校验）——
    #   这正是为了避免"候选表与实际部署的模型各说各话、auto 请求全部 502"。
    #   cost-per-1k 与 pricing 同口径（元 / 1K tokens），仅在模型没配 pricing 时兜底。
    candidates:
      - model: gpt-4o-mini
        tier: CHEAP
        cost-per-1k: 0.0030
        quality-score: 0.72
      - model: gpt-4o
        tier: STRONG
        cost-per-1k: 0.0600
        quality-score: 0.90

    # ★ 按任务选模型。规则是**覆盖 + 兜底**：命中任务就用 tasks 里的模型，
    #   没命中（或推断不出）落 default-task。它和 policy 不是并列关系 ——
    #   开启之后 policy 不再参与，所以刻意没有再保留一个 policy=TASK_BASED：
    #   同一件事两个开关，四种组合里必有两种语义不明。
    #
    #   三条启动期校验（写错就起不来，而不是运行时静默走错模型）：
    #     ① default-task 必须在 tasks 里声明；
    #     ② 每个任务指定的 model 必须已存在于上面的 candidates
    #        （不在候选表里就没有 quality-score，级联升级会永远找不到更强档位）；
    #     ③ enabled 时 tasks 不能为空。
    #
    #   这里默认关闭，但保留一份与上面 candidates 对应的示例配置：
    #   把 enabled 改成 true 就能直接生效，不必再猜格式。
    task-routing:
      enabled: false
      default-task: chat
      # rule = 纯规则推断（零延迟零成本）；off = 只认客户端显式声明的 task。
      classifier: rule
      tasks:
        code:
          model: gpt-4o
        extract-json:
          model: gpt-4o-mini
        summarize:
          model: gpt-4o-mini
        chat:
          model: gpt-4o-mini
  # 计费单价（元 / 1K tokens）。★ 示例值，请按你自己的实际账单口径替换。
  # 没有配置单价的模型，会回退到 ModelTier.costPer1k 按总 token 估算。
  pricing:
    deepseek-flash:
      input-per-1k: 0.0005
      output-per-1k: 0.0015
    deepseek-v4-pro:
      input-per-1k: 0.0020
      output-per-1k: 0.0080
    gpt-4o-mini:
      input-per-1k: 0.0010
      output-per-1k: 0.0030
    gpt-4o:
      input-per-1k: 0.0200
      output-per-1k: 0.0600
  providers:
    - name: openai
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      models: [gpt-4o-mini, gpt-4o]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    # %X{traceId} 从 MDC 取，没有时显示 --。
    # ★ traceId 能被打印出来，靠的是「TraceIdFilter 写 Reactor Context →
    #   MdcContextLifter 在每次算子回调前同步进 MDC」这条链，不是直接 MDC.put。
    #   在 WebFlux 下直接 put 会串味（Netty 事件循环线程被多请求复用）
    #   或丢失（处理过程跨线程），两种情况都比不打更糟。
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:--}] %logger{20} - %msg%n"
